[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsmith"
version = "0.1.0"
description = "Function calling and constrained decoding built from first principles"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "openai>=1.50,<3",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
colab = [
    "huggingface_hub>=0.30,<2",
    "torch>=2.4,<3",
    "transformers>=4.51,<5",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
